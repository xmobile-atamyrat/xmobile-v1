# Language redirect, part 2 of 2: include inside the site's `location /`,
# before proxy_pass (on the VM: /etc/nginx/snippets/xmobile-locale-redirect.conf).
# Needs nginx-locale-maps.conf in the `http` block.
#
# 307 = temporary: browsers and search engines never remember it, so a later
# pick (or a fix here) takes effect at once. The Location is relative, so the
# browser keeps its own host (www or not) and https.
#
# No add_header in here: one inside `if` makes nginx drop every add_header
# from the server and location (HSTS, security headers) on this response.
# None is needed either: a 307 without Cache-Control or Expires is never
# stored by a browser or proxy (RFC 9111 4.2.2), so it cannot be replayed to
# a visitor with another cookie or language.
absolute_redirect off;

if ($lc_redirect) {
    return 307 $lc_path;
}
