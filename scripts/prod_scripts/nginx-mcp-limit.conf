# MCP rate limit, part 2 of 2: include inside the site's `location /`
# (on the VM: /etc/nginx/snippets/xmobile-mcp-limit.conf). Needs
# nginx-mcp-limit-zone.conf in the `http` block.
#
# Requests outside /api/mcp and /.well-known/oauth-* (with or without a
# locale prefix) have an empty key and pass untouched. Up to 40 at once are let through without delay; past that,
# 429, which the MCP clients treat as "slow down".
limit_req zone=xmobile_mcp burst=40 nodelay;
limit_req_status 429;
