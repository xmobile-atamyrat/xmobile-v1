# MCP rate limit, part 1 of 2: the zone. Goes in nginx's `http` block
# (on the VM: /etc/nginx/conf.d/xmobile-mcp-limit-zone.conf). Part 2,
# nginx-mcp-limit.conf, goes inside the site's `location /`.
#
# Only the MCP server and its OAuth routes are limited: every other path maps
# to an empty key, and nginx doesn't count requests with an empty key. This
# runs before Next, so a flood of made-up tokens never reaches the database.
# The app has its own per-connection limit on top (src/lib/mcp/rateLimit.ts).
# Next serves every route under a locale prefix too (/en/api/mcp and so on),
# so the patterns allow one (in any case, as Next matches it): without it, a
# prefix would skip the limit.
map $uri $xmobile_mcp_limit_key {
    default "";
    "~*^(/(en|ru|tk|ch|tr))?/api/mcp(/|$)" $binary_remote_addr;
    "~*^(/(en|ru|tk|ch|tr))?/\.well-known/oauth-" $binary_remote_addr;
}

# Per client IP. The AI platforms call from their own servers, and a chat
# with a few quick tool calls stays far below this; the burst in part 2
# absorbs those. 1 MB holds about 16,000 addresses.
limit_req_zone $xmobile_mcp_limit_key zone=xmobile_mcp:1m rate=5r/s;
