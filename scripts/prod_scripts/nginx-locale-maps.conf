# Language redirect, part 1 of 2: the rules. Goes in nginx's `http` block
# (on the VM: /etc/nginx/conf.d/xmobile-locale-maps.conf). Part 2,
# nginx-locale-redirect.conf, goes inside the site's `location /`.
#
# Which language a page opens in, highest first:
#   1. NEXT_LOCALE cookie -- the visitor's own pick in the switcher.
#   2. The browser's / phone's main language (first Accept-Language entry),
#      even over a link in another language: a Russian phone opening a
#      shared /en/... link gets the Russian page.
#   3. The link's language (/en/..., /tk/...), when the browser's is one we
#      don't ship.
#   4. GeoIP, home page only -- done by Next (src/pages/index.page.tsx).
#   5. ru.
# nginx only reads the cookie; it never sets one. Steps 1-3 must match
# src/lib/localeDetection.ts. Maps cost nothing until the `if` reads them.
# Tested by tests/integration/nginx-locale-redirect.integration.test.ts.

# 1. The visitor's pick, only if it is one of our locales.
map $cookie_NEXT_LOCALE $lc_pick {
    default "";
    "~^(en|ru|tk|ch|tr)$" $cookie_NEXT_LOCALE;
}

# The link's language: /en/..., /tk/... (an explicit /ru/... counts too).
# Read from the raw $request_uri, the same source as $lc_bare below: with the
# decoded $uri, /%65n/x would count as /en/x but keep its prefix (a redirect
# loop), and /en//evil.com/ would count as /en/evil.com/.
map $request_uri $lc_link {
    default "";
    "~*^/(?<lc_link_m>en|ru|tk|ch|tr)(?:[/?]|$)" $lc_link_m;
}

# The raw path and query without the locale prefix ("" for a bare /en).
# Raw ($request_uri), so encoded characters reach the Location unchanged.
map $request_uri $lc_bare {
    default $request_uri;
    "~*^/(?:en|ru|tk|ch|tr)(?<lc_bare_m>[/?].*)?$" $lc_bare_m;
}

# 2. The browser's main language: the first Accept-Language entry only, as
#    Chrome appends `en` to most lists. 'ch' is never detected (no browser
#    reports it; ISO 'ch' is Chamorro), only picked.
map $http_accept_language $lc_browser {
    default "";
    "~*^\s*en(?:[-_][^,;]*)?\s*(?:[,;]|$)" en;
    "~*^\s*ru(?:[-_][^,;]*)?\s*(?:[,;]|$)" ru;
    "~*^\s*tk(?:[-_][^,;]*)?\s*(?:[,;]|$)" tk;
    "~*^\s*tr(?:[-_][^,;]*)?\s*(?:[,;]|$)" tr;
}

# The pick, else the browser's language. Neither = 3: the link's stays.
map "$lc_pick|$lc_browser" $lc_target {
    default "";
    "~^(?<lc_t1>[^|]+)\|" $lc_t1;
    "~^\|(?<lc_t2>[^|]+)$" $lc_t2;
}

# The language the URL is in now (no prefix = ru).
map $lc_link $lc_current {
    "" ru;
    default $lc_link;
}

map "$lc_target:$lc_current" $lc_mismatch {
    default 1;
    "~^:" 0;
    "~^([^:]+):\1$" 0;
}

# Where to send them. ru has no prefix, and a locale home is /en, not /en/
# (Next would redirect the slash away: one more hop).
map "$lc_target|$lc_bare" $lc_path {
    "~^ru\|/?(?<lc_q0>\?.*)?$" /$lc_q0;
    "~^ru\|(?<lc_p1>.+)$" $lc_p1;
    "~^(?<lc_l2>[^|]+)\|/?(?<lc_q2>\?.*)?$" /$lc_l2$lc_q2;
    "~^(?<lc_l3>[^|]+)\|(?<lc_p3>.+)$" /$lc_l3$lc_p3;
}

# A Location starting // or /\ is another site to a browser (/en//evil.com/
# with a ru target would become //evil.com/). Never send one.
map $lc_path $lc_path_ok {
    default 1;
    "~^/[/\x5C]" 0;
}

# Search engines and link previews get the URL as asked, so every language
# stays indexable and a preview matches its link. No user agent = a script.
# CUBOT phones are people. Same list as isCrawler in src/lib/localeDetection.ts.
map $http_user_agent $lc_bot {
    default 0;
    "" 1;
    "~*(?<!cu)bot\b" 1;
    "~*crawl|spider|slurp|mediapartners|google-inspectiontool|googleother|apis-google|facebookexternalhit|facebookcatalog|whatsapp|skypeuripreview|vkshare|yandex|bingpreview|embedly|quora link preview|pinterest|lighthouse|pagespeed" 1;
}

map $request_method $lc_method_ok {
    GET 1;
    HEAD 1;
    default 0;
}

# Not pages: API, Next's own files and data, uploads, chat, certificates, and
# anything with a file extension (robots.txt, sitemap.xml, icons...).
map $uri $lc_not_page {
    default 0;
    "~^/(?:api|_next|media|ws|\.well-known)(?:/|$)" 1;
    "~\.[A-Za-z0-9]+$" 1;
}

# Redirect only a full page load (GET/HEAD, not a client navigation or a
# prefetch) from a person, when the wanted language differs from the URL's.
map "$lc_method_ok:$lc_bot:$lc_not_page:$http_x_nextjs_data:$http_purpose:$lc_mismatch:$lc_path_ok" $lc_redirect {
    default 0;
    "1:0:0:::1:1" 1;
}
